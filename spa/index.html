<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastros — CS Gourmet</title>
    <script>
      (function () {
        try {
          var dark = false;
          try {
            dark = parent.document.documentElement.getAttribute("data-theme") === "dark";
          } catch (e) {
            dark = localStorage.getItem("csm_theme") === "dark";
          }
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
